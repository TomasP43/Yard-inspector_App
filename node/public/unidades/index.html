<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<title>Inspección de unidades</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="./css/unidades.css">
<script>
/* Tema antes de pintar, igual que en patrullas: si esperara a app.js la
   pantalla arrancaria oscura y saltaria a clara en cada visita. */
try {
  var t = localStorage.getItem('yard-tema');
  if (t === 'claro') document.documentElement.setAttribute('data-tema', 'claro');
} catch (e) {}
</script>
</head>
<body>

<header class="barra">
  <span class="marca" aria-hidden="true"></span>
  <h1>Yard Inspector</h1>
  <div id="estado" class="estado" hidden></div>
  <button id="tema" class="btn-tema" type="button" aria-label="Cambiar a modo claro">
    <svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
    </svg>
  </button>
  <div id="avatar" class="avatar" title="Sesión de TTFA"></div>
</header>

<nav class="modulos">
  <a href="../" class="mod">Patrullas</a>
  <a href="./" class="mod activo">Unidades</a>
</nav>

<main>
  <!-- 1. viajes del dia -->
  <section id="v-viajes" class="vista">
    <div class="filtros">
      <select id="f-playa"></select>
      <input id="f-fecha" type="date">
    </div>
    <button id="nuevo-viaje" class="btn-secundario" type="button">+ Cargar viaje</button>
    <div id="lista-viajes" class="lista"></div>
  </section>

  <!-- 2. unidades del viaje -->
  <section id="v-unidades" class="vista" hidden>
    <button id="volver-viajes" class="link atras" type="button">&larr; Viajes</button>
    <div id="cab-viaje" class="cab-viaje"></div>
    <div class="etapas" id="etapas"></div>
    <div id="lista-unidades" class="lista"></div>
  </section>
</main>

<!-- 3. inspeccion de una unidad -->
<div id="modal-insp" class="modal" hidden>
  <div class="form">
    <header class="form-barra">
      <button type="button" id="insp-cancelar" class="link">Cancelar</button>
      <strong id="insp-titulo">Unidad</strong>
      <button type="button" id="insp-guardar" class="link fuerte">Guardar</button>
    </header>

    <div class="form-cuerpo">
      <div id="insp-datos" class="datos-unidad"></div>

      <!-- Sin daños es la accion principal: la mayoria de las unidades esta bien -->
      <div class="acciones-primarias">
        <button type="button" id="btn-sin-danos" class="btn-grande ok">Sin daños</button>
        <button type="button" id="btn-agregar-dano" class="btn-grande alerta">Agregar daño</button>
      </div>

      <div id="lista-danos" class="danos"></div>

      <label id="lbl-pano" hidden>Foto panorámica
        <input type="file" accept="image/*" capture="environment" id="foto-pano">
      </label>

      <label>Foto del VIN <span class="opcional">(opcional, para verificar la unidad)</span>
        <input type="file" accept="image/*" capture="environment" id="foto-vin">
      </label>

      <label>Observación
        <textarea id="insp-obs" rows="2" placeholder="Algo que aclarar"></textarea>
      </label>

      <div id="bloque-firma">
        <span class="rotulo">Firma del inspector</span>
        <canvas id="firma" class="firma"></canvas>
        <button type="button" id="firma-borrar" class="link">Borrar firma</button>
      </div>
    </div>
  </div>
</div>

<!-- 4. carga de un dano: parte, cuadrante, tipo, foto -->
<div id="modal-dano" class="modal" hidden>
  <div class="form">
    <header class="form-barra">
      <button type="button" id="dano-cancelar" class="link">Cancelar</button>
      <strong>Daño</strong>
      <button type="button" id="dano-ok" class="link fuerte">Listo</button>
    </header>

    <div class="form-cuerpo">
      <label>Parte
        <input id="buscar-parte" type="search" placeholder="Buscar pieza" autocomplete="off">
      </label>
      <div id="partes" class="chips"></div>

      <div id="bloque-cuadrante" hidden>
        <span class="rotulo">Cuadrante <span id="cuad-ayuda" class="opcional"></span></span>
        <div id="cuadrantes" class="cuadrantes"></div>
      </div>

      <div id="bloque-tipo" hidden>
        <span class="rotulo">Tipo de daño</span>
        <div id="tipos" class="chips"></div>
        <button type="button" id="add-tipo" class="chip chip-add">+ Otro tipo</button>
        <div id="caja-tipo" class="caja-nuevo" hidden>
          <input id="tipo-nuevo" type="text" maxlength="120" autocomplete="off" placeholder="Escribí el tipo de daño">
          <div id="sug-tipo" class="sugerencias"></div>
          <div class="acciones-nuevo">
            <button type="button" id="tipo-cancelar" class="link">Cancelar</button>
            <button type="button" id="tipo-ok" class="btn">Agregar</button>
          </div>
        </div>
      </div>

      <label id="lbl-detalle-dano">Detalle <span class="opcional">(opcional)</span>
        <input id="detalle-dano" type="text" list="detalles" maxlength="160" autocomplete="off" placeholder="Ej: Malformación">
        <datalist id="detalles"></datalist>
      </label>

      <label id="lbl-foto-dano">Foto del daño
        <input type="file" accept="image/*" capture="environment" id="foto-dano">
      </label>
    </div>
  </div>
</div>

<!-- 5. carga manual de un viaje -->
<div id="modal-viaje" class="modal" hidden>
  <form id="form-viaje" class="form">
    <header class="form-barra">
      <button type="button" id="viaje-cancelar" class="link">Cancelar</button>
      <strong>Cargar viaje</strong>
      <button type="submit" class="link fuerte">Crear</button>
    </header>

    <div class="form-cuerpo">
      <p class="nota">
        En Zárate los viajes llegan solos desde el sistema de solicitudes.
        Esta pantalla es para las playas que todavía no están integradas, y para
        corregir a mano.
      </p>

      <label>Playa *
        <select name="playa" required></select>
      </label>

      <label>Flujo *
        <select name="flujo" required></select>
      </label>

      <label>Fecha *
        <input name="fecha" type="date" required>
      </label>

      <label>Equipo <span class="opcional">(número de camión)</span>
        <input name="equipo" type="number" inputmode="numeric" placeholder="3595">
      </label>

      <label>Referencia externa <span class="opcional">(id en el otro sistema)</span>
        <input name="referencia" type="text" maxlength="60" placeholder="SOL-000123">
      </label>

      <label>Unidades *
        <textarea name="unidades" rows="9" required
          placeholder="Un VIN por línea. Opcional: VIN, modelo, destino&#10;&#10;8AJBA3CD4T8003610, Hilux, TCL&#10;8AJDA8CBXT8108950, Corolla Cross&#10;8AJBA3FS7T0422799"></textarea>
      </label>
      <p class="nota" id="viaje-conteo"></p>
    </div>
  </form>
</div>

<script src="../js/similitud.js"></script>
<script src="../js/camera.js"></script>
<script src="./js/db.js"></script>
<script src="./js/sync.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
