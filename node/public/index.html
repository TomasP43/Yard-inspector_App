<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<title>Yard Inspector</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/inicio.css">
<script>
try {
  var t = localStorage.getItem('yard-tema');
  if (t === 'claro') document.documentElement.setAttribute('data-tema', 'claro');
} catch (e) {}
</script>
</head>
<body>

<header class="barra">
  <span class="marca" aria-hidden="true"></span>
  <h1>Yard Inspector</h1>
  <button id="tema" class="btn-tema" type="button" aria-label="Cambiar a modo claro">
    <svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
    </svg>
  </button>
  <div id="avatar" class="avatar" title="Sesión de TTFA"></div>
</header>

<main class="inicio">
  <h2 class="saludo">Hola<span id="nombre"></span></h2>

  <!-- Lo pendiente de sincronizar va primero y solo aparece si hay algo.
       Es lo único que el inspector necesita accionar al volver de la playa. -->
  <a href="#" id="aviso-cola" class="aviso-cola" hidden>
    <span class="punto" aria-hidden="true"></span>
    <span id="aviso-cola-txt"></span>
  </a>

  <div class="tarjetas">
    <a class="tarjeta" href="./patrullas/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17V7h11v10z"/><path d="M14 10h3.5l2.5 3v4h-6z"/>
          <circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>
        </svg>
      </span>
      <b class="dato" id="c-patrullas">—</b>
      <span class="nombre">Patrullas</span>
      <span class="detalle">desvíos cargados hoy</span>
    </a>

    <a class="tarjeta" href="./unidades/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15l1.5-5A2 2 0 017.4 8.6h9.2A2 2 0 0118.5 10L20 15v4h-2.5v-1.5h-11V19H4z"/>
          <path d="M6.5 15h11"/><circle cx="7.5" cy="17" r=".6" fill="currentColor"/><circle cx="16.5" cy="17" r=".6" fill="currentColor"/>
        </svg>
      </span>
      <b class="dato" id="c-unidades">—</b>
      <span class="nombre">Unidades</span>
      <span class="detalle">viajes abiertos</span>
    </a>
  </div>

  <p class="nota" id="estado-conexion"></p>
</main>

<script src="./js/inicio.js"></script>
</body>
</html>
